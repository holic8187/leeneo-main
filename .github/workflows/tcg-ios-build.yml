name: TCG iOS Build

on:
  pull_request:
    paths:
      - "tcg-desktop/**"
      - ".github/workflows/tcg-ios-build.yml"
  workflow_dispatch:
    inputs:
      signed_archive:
        description: "Also export a signed App Store IPA (requires Apple Developer signing secrets)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: tcg-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tcg-desktop
    env:
      VITE_TCG_API_BASE: ${{ vars.TCG_API_BASE || 'https://leeneo-main.onrender.com' }}
      VITE_TCG_IOS_APP_STORE_ID: ${{ vars.TCG_IOS_APP_STORE_ID }}
      VITE_TCG_IOS_TESTFLIGHT_URL: ${{ vars.TCG_IOS_TESTFLIGHT_URL }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tcg-desktop/pnpm-lock.yaml
      - name: Install client dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify shared game logic
        run: pnpm test
      - name: Build and synchronize iOS
        run: pnpm run ios:sync
      - name: Verify iOS notification timing
        run: |
          mkdir -p ios/output
          swiftc ios/App/App/GameNotificationPolicy.swift ios/Tests/NotificationPolicyTests.swift -o ios/output/notification-policy-tests
          ios/output/notification-policy-tests
      - name: Build for iPhone Simulator
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO build | tee ios/output/simulator-build.log
      - name: Launch iPhone Simulator smoke test
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$device_id" com.hoicompany.carddesk
          sleep 10
          xcrun simctl io "$device_id" screenshot ios/output/iphone-launch.png
          xcrun simctl shutdown "$device_id"
      - name: Build unsigned iPhone archive
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ios/output/Hoi-Card-Desk-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive | tee ios/output/device-archive.log
          ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app ios/output/Hoi-Card-Desk-simulator.zip
          ditto -c -k --sequesterRsrc --keepParent ios/output/Hoi-Card-Desk-unsigned.xcarchive ios/output/Hoi-Card-Desk-unsigned-archive.zip
      - name: Export signed IPA when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.signed_archive
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: bash scripts/build-ios-signed.sh
      - name: Keep build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoi-card-desk-ios-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            tcg-desktop/ios/output/*.log
            tcg-desktop/ios/output/*.png
            tcg-desktop/ios/output/*.zip
            tcg-desktop/ios/output/export/*.ipa
